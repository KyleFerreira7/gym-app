<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the app use the whole iPhone screen (around the notch). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ef">
  <title>Gym</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Every screen is drawn inside this one element by js/app.js. -->
  <main id="app"></main>

  <!-- Order matters: data first, then helpers, then the screens that use them. -->
  <script src="data/exercises.js"></script>
  <script src="data/workouts.js"></script>
  <script src="data/plans.js"></script>
  <script src="data/groupings.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/player.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
