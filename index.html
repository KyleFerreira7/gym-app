<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the app use the whole iPhone screen (around the notch). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Colour of the phone's status bar area, light and dark. -->
  <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151714" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <title>Gym</title>

  <!-- Installing to the home screen: the app's name, icon and full-screen mode. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icons/icon-192.png">
  <link rel="apple-touch-icon" href="img/icons/icon-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gym">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Every screen is drawn inside this one element by js/app.js. -->
  <main id="app"></main>

  <!-- Order matters: data first, then helpers, then the screens that use them. -->
  <script src="data/exercises.js"></script>
  <script src="data/workouts.js"></script>
  <script src="data/plans.js"></script>
  <script src="data/groupings.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/wakelock.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/player.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/builder.js"></script>
  <script src="js/me.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
